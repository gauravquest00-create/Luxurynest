<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LuxuryNest Admin – Login</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F4F6FA 0%, #E8ECF2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* Main container */
        .login-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Card */
        .login-card {
            background: #FFFFFF;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
        }

        /* Left side – branding & features */
        .login-left {
            flex: 1.2;
            background: #0F1825;
            padding: 3rem 2rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-area {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            height: 42px;
            width: auto;
        }
        .logo-area h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #C6A43F;
            margin: 0;
        }

        .welcome-text {
            margin-bottom: 1.5rem;
        }
        .welcome-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        .welcome-text h1 span {
            color: #C6A43F;
        }
        .welcome-text p {
            font-size: 1rem;
            color: #B0C4DE;
            margin-top: 0.75rem;
        }

        .feature-stats {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1E2F44;
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(198, 164, 63, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #C6A43F;
        }
        .stat-badge i {
            font-size: 1rem;
        }

        /* Right side – login form */
        .login-right {
            flex: 1;
            padding: 3rem 2.5rem;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-right h3 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1E2A3A;
            margin-bottom: 0.25rem;
        }
        .login-right .sub {
            color: #5A6E7F;
            margin-bottom: 1.75rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5A6E7F;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #E2E8F0;
            border-radius: 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #F8FAFC;
        }
        .form-group input:focus {
            outline: none;
            border-color: #C6A43F;
            box-shadow: 0 0 0 3px rgba(198, 164, 63, 0.2);
            background: white;
        }

        .btn-login {
            width: 100%;
            background: #C6A43F;
            color: #1E2A3A;
            border: none;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: #b3922e;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loader-icon {
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-link {
            text-align: right;
            margin-top: 0.5rem;
        }
        .forgot-link a {
            font-size: 0.8rem;
            color: #C6A43F;
            text-decoration: none;
            transition: 0.2s;
        }
        .forgot-link a:hover {
            text-decoration: underline;
        }

        .get-started {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5A6E7F;
        }
        .get-started a {
            color: #C6A43F;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
            transition: 0.2s;
        }
        .get-started a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #FEF2F2;
            color: #B91C1C;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        .redirect-message {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #C6A43F;
            display: none;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .login-card {
                flex-direction: column;
                max-width: 500px;
            }
            .login-left {
                padding: 2rem;
                text-align: center;
            }
            .logo-area {
                justify-content: center;
            }
            .welcome-text h1 {
                font-size: 2rem;
            }
            .login-right {
                padding: 2rem;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            .login-right h3 {
                font-size: 1.4rem;
            }
            .welcome-text h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Left side: branding & features -->
            <div class="login-left">
                <div class="logo-area">
                    <img src="/luxuryadmin/logo.png" alt="LuxuryNest" class="logo-img">
                    <h2>LuxuryNest</h2>
                </div>
                <div class="welcome-text">
                    <h1>Your Property<br><span>Our Priority</span></h1>
                    <p>Your trusted partner in luxury real estate.</p>
                </div>

                 
                <div class="feature-stats">
                    <div class="stat-badge">
                        <i class="fas fa-users"></i> Get accessed by over 1 Lakh buyers
                    </div>
                </div>
            </div>

            <!-- Right side: login form -->
            <div class="login-right">
                <h3>Admin Login</h3>
                <div class="sub">Access your dashboard</div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@luxurynest.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                </div>

                <button class="btn-login" id="loginBtn">Login <i class="fas fa-arrow-right"></i></button>
                <div id="errorMsg" class="error-msg" style="display: none;"></div>
                <div id="redirectMsg" class="redirect-message">
                    <i class="fas fa-spinner fa-pulse"></i> Redirecting to dashboard...
                </div>

                <div class="forgot-link">
    <a href="/luxuryadmin/forgot-password.html">Forgot password?</a>
</div>
                <div class="get-started">
                    Don't have an account? <a href="#">Get Started Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('errorMsg');
        const redirectMsgDiv = document.getElementById('redirectMsg');
        let isLoggingIn = false;

        async function login() {
            if (isLoggingIn) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Please enter email and password';
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Enter a valid email address';
                return;
            }

            errorDiv.style.display = 'none';
            isLoggingIn = true;
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loader-icon"></span> Authenticating...';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    // Hide button, show redirect message
                    loginBtn.style.display = 'none';
                    redirectMsgDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/luxuryadmin';
                    }, 600);
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = data.message || 'Login failed';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
                    isLoggingIn = false;
                    loginBtn.style.display = 'flex';
                    redirectMsgDiv.style.display = 'none';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Network error. Please try again.';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
                isLoggingIn = false;
                loginBtn.style.display = 'flex';
                redirectMsgDiv.style.display = 'none';
            }
        }

        loginBtn.addEventListener('click', login);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
