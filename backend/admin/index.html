    <!-- Bottom Navigation & Active Sync Script (does not modify existing logic) -->
    <script>
        (function() {
            // Wait for DOM and main.js loadPage to be ready
            function initBottomNav() {
                const bottomNavItems = document.querySelectorAll('.bottom-nav-item');
                if (!bottomNavItems.length) return;
                
                // Function to update active state in bottom nav based on current page
                function updateBottomNavActive(page) {
                    bottomNavItems.forEach(item => {
                        const itemPage = item.getAttribute('data-page');
                        if (itemPage === page) {
                            item.classList.add('active');
                        } else {
                            item.classList.remove('active');
                        }
                    });
                }
                
                // Hook into loadPage (if available) to sync active class
                const originalLoadPage = window.loadPage;
                if (typeof originalLoadPage === 'function') {
                    window.loadPage = function(page, ...args) {
                        originalLoadPage(page, ...args);
                        updateBottomNavActive(page);
                    };
                } else if (typeof window.loadPage === 'undefined' && typeof loadPage !== 'undefined') {
                    const originalGlobalLoadPage = loadPage;
                    window.loadPage = function(page, ...args) {
                        originalGlobalLoadPage(page, ...args);
                        updateBottomNavActive(page);
                    };
                }
                
                // Add click handlers to bottom nav items
                bottomNavItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        const page = item.getAttribute('data-page');
                        if (page && typeof window.loadPage === 'function') {
                            window.loadPage(page);
                        } else if (page && typeof loadPage === 'function') {
                            loadPage(page);
                        }
                        // Close mobile sidebar if open
                        if (window.innerWidth <= 768 && typeof window.closeSidebar === 'function') {
                            window.closeSidebar();
                        }
                    });
                });
                
                // Initial sync when page loads
                const currentActiveSidebar = document.querySelector('.nav-link.active');
                if (currentActiveSidebar) {
                    const currentPage = currentActiveSidebar.getAttribute('data-page');
                    updateBottomNavActive(currentPage);
                }
            }
            
            // Run after all scripts have loaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBottomNav);
            } else {
                initBottomNav();
            }
        })();
    </script>

    <script>
        (function() {
            var nameSpan = document.getElementById('adminName');
            if (nameSpan && !nameSpan.innerText) nameSpan.innerText = 'Admin';
        })();
    </script>
