<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – LuxuryNest Admin</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #F4F6FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .forgot-card {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        .logo-img {
            height: 40px;
            width: auto;
        }
        .logo-area h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #C6A43F;
        }
        h3 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #1E2A3A;
        }
        .sub {
            text-align: center;
            color: #5A6E7F;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5B6E8C;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #CBD5E1;
            border-radius: 14px;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #C6A43F;
            box-shadow: 0 0 0 2px rgba(198,164,63,0.2);
        }
        .btn {
            width: 100%;
            background: #C6A43F;
            border: none;
            padding: 0.75rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            background: #b3922e;
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .otp-group {
            display: flex;
            gap: 0.5rem;
        }
        .otp-group input {
            flex: 1;
        }
        .info-message, .error-message {
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 12px;
            margin-top: 0.5rem;
            text-align: center;
        }
        .info-message {
            background: #EFF6FF;
            color: #2563EB;
        }
        .error-message {
            background: #FEF2F2;
            color: #DC2626;
        }
        .hidden {
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 1rem;
        }
        .back-link a {
            color: #C6A43F;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forgot-card">
        <div class="logo-area">
            <img src="/luxuryadmin/logo.png" alt="LuxuryNest" class="logo-img">
            <h2>LuxuryNest</h2>
        </div>
        <h3>Reset Password</h3>
        <div class="sub">Enter your email to receive a verification code</div>

        <!-- Step 1: Email -->
        <div id="stepEmail">
            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="resetEmail" placeholder="admin@luxurynest.com" autocomplete="email">
            </div>
            <button class="btn" id="sendOtpBtn">Send OTP <i class="fas fa-paper-plane"></i></button>
            <div id="emailError" class="error-message hidden"></div>
            <div id="emailInfo" class="info-message hidden"></div>
        </div>

        <!-- Step 2: OTP + New Password (initially hidden) -->
        <div id="stepOtp" class="hidden">
            <div class="form-group">
                <label>Enter OTP</label>
                <div class="otp-group">
                    <input type="text" id="otpCode" placeholder="6-digit code" maxlength="6">
                    <button id="verifyOtpBtn" class="btn" style="width: auto; padding: 0.75rem 1.2rem;">Verify</button>
                </div>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" disabled>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" disabled>
            </div>
            <button class="btn" id="resetPasswordBtn" disabled>Set New Password</button>
            <div id="otpError" class="error-message hidden"></div>
            <div id="otpInfo" class="info-message hidden"></div>
        </div>

        <div class="back-link">
            <a href="/luxuryadmin/login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let resetEmail = '';

        const stepEmailDiv = document.getElementById('stepEmail');
        const stepOtpDiv = document.getElementById('stepOtp');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const emailInput = document.getElementById('resetEmail');
        const otpInput = document.getElementById('otpCode');
        const newPwd = document.getElementById('newPassword');
        const confirmPwd = document.getElementById('confirmPassword');
        const emailError = document.getElementById('emailError');
        const emailInfo = document.getElementById('emailInfo');
        const otpError = document.getElementById('otpError');
        const otpInfo = document.getElementById('otpInfo');

        function showError(el, msg) { el.innerText = msg; el.classList.remove('hidden'); }
        function hideError(el) { el.classList.add('hidden'); }
        function showInfo(el, msg) { el.innerText = msg; el.classList.remove('hidden'); }
        function hideInfo(el) { el.classList.add('hidden'); }

        function setPasswordFieldsEnabled(enabled) {
            newPwd.disabled = !enabled;
            confirmPwd.disabled = !enabled;
            resetPasswordBtn.disabled = !enabled;
        }

        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showError(emailError, 'Please enter your email address');
                return;
            }
            if (!email.includes('@')) {
                showError(emailError, 'Enter a valid email address');
                return;
            }
            hideError(emailError);
            hideInfo(emailInfo);
            sendOtpBtn.disabled = true;
            const originalText = sendOtpBtn.innerHTML;
            sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            try {
                const res = await fetch(`${API_BASE}/admin/forgot-password/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    resetEmail = email;
                    showInfo(emailInfo, 'OTP sent to your email. Please check inbox/spam.');
                    stepEmailDiv.classList.add('hidden');
                    stepOtpDiv.classList.remove('hidden');
                } else {
                    showError(emailError, data.message || 'Failed to send OTP');
                }
            } catch (err) {
                showError(emailError, 'Network error. Please try again.');
            } finally {
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerHTML = originalText;
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const otp = otpInput.value.trim();
            if (!otp) {
                showError(otpError, 'Please enter the OTP');
                return;
            }
            hideError(otpError);
            hideInfo(otpInfo);
            verifyOtpBtn.disabled = true;
            verifyOtpBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
            try {
                const res = await fetch(`${API_BASE}/admin/forgot-password/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, otp })
                });
                const data = await res.json();
                if (res.ok) {
                    showInfo(otpInfo, 'OTP verified. You can now set a new password.');
                    otpInput.disabled = true;
                    verifyOtpBtn.disabled = true;
                    verifyOtpBtn.style.opacity = '0.6';
                    setPasswordFieldsEnabled(true);
                } else {
                    showError(otpError, data.message || 'Invalid OTP');
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.innerHTML = 'Verify';
                }
            } catch (err) {
                showError(otpError, 'Network error');
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.innerHTML = 'Verify';
            }
        });

        resetPasswordBtn.addEventListener('click', async () => {
            const password = newPwd.value;
            const confirm = confirmPwd.value;
            if (!password || !confirm) {
                showError(otpError, 'Please enter and confirm new password');
                return;
            }
            if (password !== confirm) {
                showError(otpError, 'Passwords do not match');
                return;
            }
            if (password.length < 6) {
                showError(otpError, 'Password must be at least 6 characters');
                return;
            }
            hideError(otpError);
            hideInfo(otpInfo);
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Updating...';
            try {
                const res = await fetch(`${API_BASE}/admin/forgot-password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, newPassword: password })
                });
                const data = await res.json();
                if (res.ok) {
                    showInfo(otpInfo, 'Password reset successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/luxuryadmin/login.html';
                    }, 2000);
                } else {
                    showError(otpError, data.message || 'Failed to reset password');
                    resetPasswordBtn.disabled = false;
                    resetPasswordBtn.innerHTML = 'Set New Password';
                }
            } catch (err) {
                showError(otpError, 'Network error');
                resetPasswordBtn.disabled = false;
                resetPasswordBtn.innerHTML = 'Set New Password';
            }
        });
    </script>
</body>
</html>
